plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'jacoco'
}

jacoco {
    toolVersion = '0.8.16'
}

android {
    namespace 'org.iurl.litegallery'
    // Build against Android 17 (needed by current AndroidX and Glide); the app still targets Android 16.
    compileSdk 37

    defaultConfig {
        applicationId "org.iurl.litegallery"
        minSdk 24
        targetSdk 36
        // Every GitHub build gets a higher number, so each APK is a real update of the previous
        // one instead of a different file with the same version. Local builds keep 611.
        versionCode System.getenv("GITHUB_RUN_NUMBER") ? 611000 + System.getenv("GITHUB_RUN_NUMBER").toInteger() : 611
        versionName "6.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Use the persistent upload key in GitHub Actions.
    // Local builds keep their normal Android debug signing.
    if (System.getenv("ANDROID_KEYSTORE_PATH")) {
        signingConfigs {
            upload {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    
    buildTypes {
        debug {
            enableUnitTestCoverage true

            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.upload
            }
        }


        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Same persistent key as the debug build, so the release APK installs as an update.
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.upload
            }
        }
    }

    lint {
        // The release build must not fail on style findings (e.g. a missing translation);
        // lint can still be run on its own.
        checkReleaseBuilds false
        abortOnError false
    }

    flavorDimensions = ["connectivity"]
    productFlavors {
        // Network-free build: no SMB code, no INTERNET permission.
        create("core") {
            dimension "connectivity"
            versionNameSuffix "-core"
        }
        // Adds SMB network shares (INTERNET permission and smbj live only here).
        // NOTE: must use create("plus") rather than `plus { }` because "plus"
        // collides with Groovy's Collection.plus operator on the container.
        create("plus") {
            dimension "connectivity"
            versionNameSuffix "-plus"
            proguardFiles 'proguard-network.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
}

// Replaces the former kotlinOptions block (an error since Kotlin 2.2).
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    // App lock: fingerprint, face or device PIN (stable release)
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    implementation 'com.github.bumptech.glide:recyclerview-integration:5.0.9'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    // Media3 dependencies (replacing ExoPlayer 2.x)
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-ui:1.11.1"
    implementation "androidx.media3:media3-common:1.11.1"
    implementation "androidx.media3:media3-datasource:1.11.1"
    // SMB client (plus flavor only — keeps the core build network-free)
    plusImplementation 'com.hierynomus:smbj:0.14.0'
    // smbj brings BouncyCastle 1.79 (login and SMB3 encryption). The current version fixes known
    // flaws, most of them in parts smbj does not use; everything smbj calls is still there.
    plusImplementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    plusImplementation 'org.slf4j:slf4j-android:1.7.36'
    
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.18'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

tasks.withType(Test).configureEach {
    jacoco {
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
}

tasks.register('jacocoTestDebugUnitTestReport', JacocoReport) {
    dependsOn 'testPlusDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    // layout.buildDirectory instead of buildDir, which Gradle 9 no longer has.
    def buildDirectory = layout.buildDirectory.get().asFile

    def coverageExcludes = [
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*Test*.*',
            '**/*Binding.*',
            '**/*BindingImpl.*',
            '**/BR.*',
            'android/**/*.*'
    ]

    // Wherever the compilers put the classes (AGP 9 compiles Kotlin itself, into another folder).
    def kotlinClasses = tasks.named('compilePlusDebugKotlin').flatMap { it.destinationDirectory }
    def javaClasses = tasks.named('compilePlusDebugJavaWithJavac').flatMap { it.destinationDirectory }
    classDirectories.setFrom(files([
            fileTree(kotlinClasses) { exclude coverageExcludes },
            fileTree(javaClasses) { exclude coverageExcludes }
    ]))
    sourceDirectories.setFrom(files(["$projectDir/src/main/java", "$projectDir/src/plus/java"]))
    executionData.setFrom(fileTree(dir: buildDirectory, includes: [
            'jacoco/testPlusDebugUnitTest.exec',
            'outputs/unit_test_code_coverage/plusDebugUnitTest/testPlusDebugUnitTest.exec'
    ]))
}
