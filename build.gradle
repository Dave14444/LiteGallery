buildscript {
    ext.kotlin_version = "2.4.21"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.5.1"
        // AGP 9 compiles Kotlin itself (built-in Kotlin); this only sets the Kotlin version it uses.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // KSP generates the Room database code (replaces kapt, which AGP 9 no longer supports).
        classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:2.3.14"
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}