
name: Build LiteGallery Plus

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Release (smaller, takes longer) or Debug (faster to build)"
        type: choice
        options:
          - Release
          - Debug
        default: Release

permissions:
  contents: read

# The actions are pinned to fixed commits: a changed version tag cannot slip other code into the
# build, which has the signing key.

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/litegallery-upload.jks"
          test -s "$RUNNER_TEMP/litegallery-upload.jks"

      - name: Build signed Plus APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/litegallery-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assemblePlus${{ inputs.build_type }}

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: LiteGallery-Plus-APK
          path: app/build/outputs/apk/plus/*/*.apk
          if-no-files-found: error

      # Runs after the APK is uploaded: a failing test turns the run red, but the APK is still
      # there to download.
      - name: Run unit tests
        run: ./gradlew testPlusDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-test-report
          path: app/build/reports/tests/testPlusDebugUnitTest
          if-no-files-found: ignore
