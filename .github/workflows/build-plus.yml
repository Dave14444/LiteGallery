
name: Build LiteGallery Plus

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (Release is shrunk; Debug is not)"
        type: choice
        options:
          - Release
          - Debug
        default: Release
      encrypt_passwords:
        description: "Encrypt saved passwords (off only to test Play Protect)"
        type: boolean
        default: true
      clean_temp_files:
        description: "Remove temporary files at app start (off only to test Play Protect)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/litegallery-upload.jks"
          test -s "$RUNNER_TEMP/litegallery-upload.jks"

      - name: Build signed Plus release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/litegallery-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LG_ENCRYPT_PASSWORDS: ${{ inputs.encrypt_passwords }}
          LG_CLEAN_TEMP_FILES: ${{ inputs.clean_temp_files }}
        run: |
          chmod +x ./gradlew
          ./gradlew assemblePlus${{ inputs.build_type }}

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: LiteGallery-Plus-APK
          path: app/build/outputs/apk/plus/*/*.apk
          if-no-files-found: error

      # Runs after the APK is uploaded: a failing test turns the run red, but the APK is still
      # there to download.
      - name: Run unit tests
        run: ./gradlew testPlusDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-report
          path: app/build/reports/tests/testPlusDebugUnitTest
          if-no-files-found: ignore
