
name: Build LiteGallery Plus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Plus APK
        run: |
          chmod +x ./gradlew
          ./gradlew assemblePlusDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiteGallery-Plus-APK
          path: app/build/outputs/apk/plus/debug/*.apk
          if-no-files-found: error
